{% extends 'partials/base.html' %}

{% block title %}Sign in &middot; O-Banking{% endblock %}

{% block content %}
<div class="container-xl py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">

            <div class="card card-md">
                <div class="card-body">
                    <h1 class="h2 text-center mb-1">Welcome back</h1>
                    <p class="text-secondary text-center mb-4">Sign in to your O-Banking account</p>

                    <form method="POST" novalidate>
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label" for="signin-email">Email address</label>
                            <input type="email" class="form-control" id="signin-email"
                                   name="email" placeholder="you@example.com"
                                   autocomplete="email" required autofocus>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="signin-password">Password</label>
                            <input type="password" class="form-control" id="signin-password"
                                   name="password" placeholder="Your password"
                                   autocomplete="current-password" required>
                        </div>

                        <div class="form-footer">
                            <button type="submit" class="btn btn-primary w-100">Sign in</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center text-secondary mt-3">
                Don't have an account yet? <a href="{% url 'userauths:sign-up' %}">Sign up</a>
            </div>

        </div>
    </div>
</div>
{% endblock content %}
